<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ATBUTH Department Portal</title>

  <link
  rel="stylesheet"
  href="department/department.css"
>

</head>


<body>

  <div class="portal-container">

    <div
      class="portal-card"
      style="max-width: 900px;"
    >

      <h1>ATBUTH</h1>

      <h2>Department Portal</h2>

      <p
        id="welcomeText"
        class="portal-subtitle"
      >
        Welcome
      </p>


      <!-- ==========================================
           DEPARTMENT INFORMATION
           ========================================== -->

      <div
        style="
          background:#f0fdf4;
          padding:20px;
          border-radius:10px;
          margin-bottom:20px;
          text-align:left;
        "
      >

        <h3>
          Department Information
        </h3>

        <p>
          <strong>Department:</strong>
          <span id="departmentName">
            Loading...
          </span>
        </p>

        <p>
          <strong>Hospital:</strong>
          <span id="hospitalName">
            ATBUTH
          </span>
        </p>

      </div>


      <!-- ==========================================
           EQUIPMENT SECTION
           ========================================== -->

      <div
        style="
          background:#ffffff;
          padding:20px;
          border:1px solid #e2e8f0;
          border-radius:10px;
          text-align:left;
        "
      >

        <h3>
          My Department Equipment
        </h3>

        <p
          id="equipmentLoading"
          style="color:#64748b;"
        >
          Loading equipment...
        </p>

        <div id="equipmentList">
        </div>

      </div>
<!-- ==========================================
     REPORT EQUIPMENT FAULT
     ========================================== -->

<div
  style="
    background:#ffffff;
    padding:20px;
    border:1px solid #e2e8f0;
    border-radius:10px;
    margin-top:20px;
    text-align:left;
  "
>

  <h3>
    Report Equipment Fault
  </h3>

  <p
    style="
      color:#64748b;
      font-size:14px;
      line-height:1.5;
    "
  >
    Select the affected equipment and describe
    the problem you are experiencing.
  </p>


  <form id="departmentComplaintForm">

    <!-- EQUIPMENT -->

    <label for="complaintEquipment">
      Equipment
    </label>

    <select
      id="complaintEquipment"
      required
      style="
        width:100%;
        padding:13px;
        margin:7px 0 18px;
        border:1px solid #cbd5e1;
        border-radius:8px;
        font-size:16px;
        background:white;
      "
    >

      <option value="">
        Select equipment
      </option>

    </select>


    <!-- FAULT -->

    <label for="complaintFault">
      Fault / Complaint
    </label>

    <textarea
      id="complaintFault"
      rows="5"
      placeholder="Describe the fault or problem..."
      required
      style="
        width:100%;
        padding:13px;
        margin:7px 0 18px;
        border:1px solid #cbd5e1;
        border-radius:8px;
        font-size:16px;
        resize:vertical;
      "
    ></textarea>


    <!-- SUBMIT -->

    <button
      type="submit"
      id="submitComplaintBtn"
      style="
        width:100%;
        padding:13px;
        border:none;
        border-radius:8px;
        background:#166534;
        color:white;
        font-size:16px;
        font-weight:600;
        cursor:pointer;
      "
    >
      Submit Fault Report
    </button>


    <!-- MESSAGE -->

    <p
      id="complaintMessage"
      class="login-message"
    ></p>

  </form>

</div>

      <!-- ==========================================
           LOGOUT
           ========================================== -->

      <button
        id="departmentLogoutBtn"
        type="button"
        style="
          width:100%;
          margin-top:20px;
          padding:13px;
          border:none;
          border-radius:8px;
          background:#991b1b;
          color:white;
          font-size:16px;
          font-weight:600;
          cursor:pointer;
        "
      >
        Logout
      </button>

    </div>

  </div>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- DASHBOARD JAVASCRIPT -->

  <script src="department/dashboard.js"></script>

</body>

</html>
